<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cerdas Cermat Kebangsaan</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="flag">🇮🇩</div><div><small>BANK SOAL INTERAKTIF</small><h1>Cerdas Cermat Kebangsaan</h1><p>12 paket • 100 soal • waktu 1 menit 30 detik</p></div></header>
<main><section id="home"><h2>Pilih paket pertandingan</h2><p>Pilih jawaban yang benar sebelum waktu habis!</p><div id="packages" class="grid"></div></section>
<section id="quiz" class="hide"><button id="back" class="back">← Semua paket</button><div class="head"><div><small id="packLabel">PAKET</small><h2 id="packTitle"></h2><p id="desc"></p></div><div class="stats"><div><small id="timerLabel">WAKTU UTAMA</small><strong id="timer">01:30</strong><small>detik</small></div><div><small>SKOR</small><strong id="score">0</strong><small>poin</small></div></div></div>
<div class="meta"><span id="progress"></span><span id="batch"></span></div><div class="track"><i id="bar"></i></div><article><div class="top"><span id="level" class="pill"></span><span id="num"></span><b id="points"></b></div><div class="body"><small>PERTANYAAN</small><h3 id="question"></h3><div id="feedback" class="hide"></div><div id="choices" class="choices"></div><div id="correctAnswer" class="hide"></div></div><div class="actions"><button id="next" class="primary">Soal berikutnya →</button><span id="left"></span></div></article></section></main>
<footer>Semangat belajar, semangat Indonesia 🇮🇩</footer>
<div id="fx"><b id="fxText"></b><div id="stars"></div></div>
<div id="finish" class="hide"><div class="red-sweep"></div><h2>Tetap Semangat!</h2><p id="summary"></p><button id="continue" class="primary">Lanjut ke paket berikutnya →</button><button id="homeBtn">Semua paket</button></div>
<script src="data.js"></script><script src="app.js"></script></body></html>
